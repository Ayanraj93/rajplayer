
name: Build RajPlayer Media3 APK

on:
  push:
    branches: [main, rajplayer-refresh-seek, media3-engine-migration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Link Android SDK 37 platform for AGP
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Prepare Media3 AV1 decoder
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm
          git clone --depth 1 --branch 1.11.1 https://github.com/androidx/media.git androidx-media
          python - <<'PYFIX'
          from pathlib import Path
          p = Path("androidx-media/build-logic/build.gradle.kts")
          s = p.read_text()
          for dep in (
              "libs.android.gradle.plugin",
              "libs.android.gradle.api",
              "libs.kotlin.gradle.plugin",
          ):
              old = f"  implementation({dep})"
              new = old + ' { exclude(group = "org.jetbrains", module = "annotations") }'
              if s.count(old) != 1:
                  raise SystemExit(f"STOP: Expected one dependency line: {dep}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          catalog = Path("androidx-media/gradle/libs.versions.toml")
          versions = catalog.read_text()
          old_version = 'androidGradlePlugin = "9.0.1"'
          if versions.count(old_version) != 1:
              raise SystemExit("STOP: Expected exactly one AndroidX AGP 9.0.1 entry")
          catalog.write_text(versions.replace(old_version, 'androidGradlePlugin = "9.1.1"', 1))
          print("AndroidX AGP aligned to RajPlayer 9.1.1")
          print("AndroidX annotations exclusions applied")
          PYFIX
          test "$(git -C androidx-media rev-parse HEAD)" = "8c6678b657ede1e7883fc164ef73ed483c7796c3"
          JNI_DIR="androidx-media/libraries/decoder_av1/src/main/jni"
          git clone --depth 1 --branch 1.5.5 https://github.com/videolan/dav1d.git "$JNI_DIR/dav1d"
          git clone --depth 1 --branch v0.9.0 https://github.com/google/cpu_features.git "$JNI_DIR/cpu_features"
          test "$(git -C "$JNI_DIR/dav1d" rev-parse HEAD)" = "6c7bee685677fd997a431302be4fea8ea4017606"
          test "$(git -C "$JNI_DIR/cpu_features" rev-parse HEAD)" = "ba4bffa86cbb5456bdb34426ad22b9551278e2c0"
          bash androidx-media/libraries/decoder_av1/src/main/jni/build_dav1d.sh "$PWD/androidx-media/libraries/decoder_av1/src/main" "$ANDROID_HOME/ndk/27.2.12479018" linux-x86_64
          test -f "$JNI_DIR/nativelib/arm64-v8a/libdav1d.a"
          test -f "$JNI_DIR/nativelib/armeabi-v7a/libdav1d.a"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Verify Media3 engine source
        run: bash ./verify_media3_engine.sh

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify MP3 encoder ABIs
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/librajplayer_mp3.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/librajplayer_mp3.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajPlayer-Media3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

