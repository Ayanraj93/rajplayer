
name: Build RajPlayer Media3 APK

on:
  push:
    branches: [main, rajplayer-refresh-seek, media3-engine-migration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Verify Media3 engine source
        run: bash ./verify_media3_engine.sh

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify MP3 encoder ABIs
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/librajplayer_mp3.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/librajplayer_mp3.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajPlayer-Media3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

