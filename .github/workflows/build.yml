name: Build RajPlayer Media3 APK
on:
  push:
    branches: [main, rajplayer-refresh-seek, media3-engine-migration]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Verify Media3 engine source
        run: bash ./verify_media3_engine.sh
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RajPlayer-Media3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
